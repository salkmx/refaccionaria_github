version: "3.9"
services:
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    ports:
      - "8082:8082"

  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    ports:
      - "8083:8083"

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - catalog-service
      - orders-service
