server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
        - id: orders-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
