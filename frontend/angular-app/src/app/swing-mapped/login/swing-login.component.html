<section class="card login-panel">
  <h2>{{ ui.title }}</h2>
  <label>
    {{ ui.usernameLabel }}
    <input type="text" placeholder="usuario" />
  </label>

  <label>
    {{ ui.passwordLabel }}
    <input type="password" placeholder="••••••" />
  </label>

  <div class="actions">
    <button type="button" class="primary">{{ ui.primaryAction }}</button>
    <button type="button">{{ ui.secondaryAction }}</button>
  </div>
</section>
